# Docker Compose with profiles: local, test, prod
# Usage: docker compose --profile <local|test|prod> up -d

x-database-base: &database-base
  image: postgres:16-alpine
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U postgres" ]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - todo-network

services:
  # ── Database Services (per-profile for volume isolation) ──────────

  database-local:
    <<: *database-base
    profiles: [ local ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

  database-test:
    <<: *database-base
    profiles: [ test ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_app_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data

  database-prod:
    <<: *database-base
    profiles: [ prod ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_THIS_IN_PRODUCTION}
      POSTGRES_DB: todo_app_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # ── Backend Services ──────────────────────────────────────────────

  backend-local:
    profiles: [ local ]
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    env_file: .env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database-local:5432/todo_app_dev
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend/src:/app/packages/backend/src:cached
      - ./packages/backend/prisma:/app/packages/backend/prisma:cached
      - ./packages/shared/src:/app/packages/shared/src:cached
    depends_on:
      database-local:
        condition: service_healthy
    networks:
      - todo-network

  backend-test:
    profiles: [ test ]
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    env_file: .env.test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database-test:5432/todo_app_test
    ports:
      - "3001:3000"
    depends_on:
      database-test:
        condition: service_healthy
    networks:
      - todo-network

  backend-prod:
    profiles: [ prod ]
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: production
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://todo_app_user:${DB_PASSWORD:-CHANGE_THIS_IN_PRODUCTION}@database-prod:5432/todo_app_prod
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      database-prod:
        condition: service_healthy
    networks:
      - todo-network

  # ── Frontend Services ─────────────────────────────────────────────

  frontend-local:
    profiles: [ local ]
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    env_file: .env.development
    ports:
      - "5173:5173"
    volumes:
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./packages/frontend/src:/app/packages/frontend/src:cached
      - ./packages/shared/src:/app/packages/shared/src:cached
    depends_on:
      - backend-local
    networks:
      - todo-network

  frontend-test:
    profiles: [ test ]
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    env_file: .env.test
    ports:
      - "5174:5173"
    depends_on:
      - backend-test
    networks:
      - todo-network

  frontend-prod:
    profiles: [ prod ]
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: production
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend-prod
    networks:
      - todo-network

volumes:
  postgres_data_local:
  postgres_data_test:
  postgres_data_prod:


networks:
  todo-network:
    driver: bridge
